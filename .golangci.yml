# golangci-lint configuration, used by pre-commit and by CI.
version: "2"

linters:
  default: standard
  enable:
    - gocognit
    - gosec
  settings:
    gocognit:
      # Same threshold as SonarQube's cognitive complexity rule (go:S3776),
      # which this check replaces.
      min-complexity: 15
    gosec:
      excludes:
        # Unchecked errors are already reported by errcheck.
        - G104
        # Reading files the user names (flags, uploads, the token store) is
        # what the CLI, the MCP server and the provider are for.
        - G304
  exclusions:
    rules:
      # Table-driven tests are long by design, and test fixtures use loose
      # permissions and fake tokens: complexity and security are checked in
      # production code only, as SonarQube did.
      - path: _test\.go
        linters:
          - gocognit
          - gosec
      # Names of keyring services and environment variables, not credentials.
      - linters:
          - gosec
        text: G101
        source: (EnvName|KeyRingServiceName|TokenKey)
