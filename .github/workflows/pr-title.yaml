# Checks that the pull request title follows Conventional Commits. The title
# becomes the squash commit message and feeds the release notes.
name: pr title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  conventional-title:
    name: conventional title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: check title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same types as in CONTRIBUTING.md.
          types: |
            feat
            fix
            docs
            test
            ci
            chore
